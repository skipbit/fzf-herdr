name: upstream-check

# Every Monday, runs the checks of pr-check.yml with the latest fzf, bats-core, shellcheck, and herdr,
# and on macOS also with the latest fish and Homebrew's bash and zsh.
# Fails when they break fzf-herdr, or when fzf, bats-core, shellcheck, fish, or herdr is newer than the version pinned in pr-check.yml.
on:
  schedule:
    - cron: "0 0 * * 1" # Mondays 09:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-latest
    outputs:
      fzf: ${{ steps.versions.outputs.fzf }}
      bats: ${{ steps.versions.outputs.bats }}
      shellcheck: ${{ steps.versions.outputs.shellcheck }}
      fish: ${{ steps.versions.outputs.fish }}
      herdr: ${{ steps.versions.outputs.herdr }}
    steps:
      - id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest() { gh release view --repo "$1" --json tagName --jq '.tagName | ltrimstr("v")'; }
          {
            echo "fzf=$(latest junegunn/fzf)"
            echo "bats=$(latest bats-core/bats-core)"
            echo "shellcheck=$(latest koalaman/shellcheck)"
            echo "fish=$(latest fish-shell/fish-shell)"
            echo "herdr=$(latest herdrdev/herdr)"
          } | tee -a "$GITHUB_OUTPUT"

  bats:
    needs: latest
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      FZF_VERSION: ${{ needs.latest.outputs.fzf }}
      BATS_VERSION: ${{ needs.latest.outputs.bats }}
      FISH_VERSION: ${{ needs.latest.outputs.fish }}
      HERDR_VERSION: ${{ needs.latest.outputs.herdr }}
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh and fish
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Install fish
        if: runner.os == 'macOS'
        run: .github/scripts/install-tools.sh fish "$FISH_VERSION"
      - name: Install bash and zsh
        if: runner.os == 'macOS'
        run: brew install bash zsh
      - run: .github/scripts/install-tools.sh fzf "$FZF_VERSION"
      - run: .github/scripts/install-tools.sh bats "$BATS_VERSION"
      - run: .github/scripts/install-tools.sh herdr "$HERDR_VERSION"
      - name: Show versions
        run: |
          bash --version | head -1
          zsh --version
          fish --version
          fzf --version
          bats --version
          herdr --version
      - run: bats test/
        env:
          FZF_HERDR_TEST_REAL_HERDR: 1

  shellcheck:
    needs: latest
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: ${{ needs.latest.outputs.shellcheck }}
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/install-tools.sh shellcheck "$SHELLCHECK_VERSION"
      - run: shellcheck bin/fzf-herdr libexec/* test/fakes/* .github/scripts/*.sh
      - run: shellcheck -s bash shell/*.bash test/*.bats test/helpers.bash

  pinned:
    needs: latest
    runs-on: ubuntu-latest
    env:
      FZF_VERSION: ${{ needs.latest.outputs.fzf }}
      BATS_VERSION: ${{ needs.latest.outputs.bats }}
      SHELLCHECK_VERSION: ${{ needs.latest.outputs.shellcheck }}
      FISH_VERSION: ${{ needs.latest.outputs.fish }}
      HERDR_VERSION: ${{ needs.latest.outputs.herdr }}
    steps:
      - uses: actions/checkout@v7
      - name: Compare with the versions pinned in pr-check.yml
        run: |
          status=0
          for name in FZF_VERSION BATS_VERSION SHELLCHECK_VERSION FISH_VERSION HERDR_VERSION; do
            pinned=$(sed -n "s/^  $name: //p" .github/workflows/pr-check.yml)
            if [ "$pinned" != "${!name}" ]; then
              echo "::error::$name in pr-check.yml is $pinned, but the latest release is ${!name}"
              status=1
            fi
          done
          exit $status
