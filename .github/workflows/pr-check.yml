name: pr-check

# Runs the bats tests on macOS and Ubuntu, including the tests with a real herdr, and shellcheck on every PR and every push to main.
# The tools are pinned to their latest releases; upstream-check.yml reports newer ones.
# The bats tests also run with fish 3, the oldest that fzf-herdr supports: 3.4.1 on macOS and apt's 3.7 on Ubuntu 24.04.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FZF_VERSION: 0.75.0
  BATS_VERSION: 1.14.0
  SHELLCHECK_VERSION: 0.11.0
  FISH_VERSION: 4.9.3
  HERDR_VERSION: 0.9.5

jobs:
  bats:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          - os: macos-latest
            fish: 3.4.1
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh and fish
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Install fish
        if: runner.os == 'macOS'
        run: .github/scripts/install-tools.sh fish "${{ matrix.fish || env.FISH_VERSION }}"
      - run: .github/scripts/install-tools.sh fzf "$FZF_VERSION"
      - run: .github/scripts/install-tools.sh bats "$BATS_VERSION"
      - run: .github/scripts/install-tools.sh herdr "$HERDR_VERSION"
      - name: Show versions
        run: |
          bash --version | head -1
          zsh --version
          fish --version
          fzf --version
          bats --version
          herdr --version
      - run: bats test/
        env:
          FZF_HERDR_TEST_REAL_HERDR: 1

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/install-tools.sh shellcheck "$SHELLCHECK_VERSION"
      - run: shellcheck --version
      - run: shellcheck bin/fzf-herdr libexec/* test/fakes/* test/real-herdr-env .github/scripts/*.sh
      - run: shellcheck -s bash shell/*.bash test/*.bats test/helpers.bash
